apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanidm
  namespace: kanidm
  annotations:
    secret.reloader.stakater.com/reload: kanidm-tls
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kanidm
  template:
    metadata:
      labels:
        app: kanidm
    spec:
      nodeSelector:
        kubernetes.io/hostname: nut-gc1
      containers:
        - name: kanidm
          image: kanidm/server:1.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: false
            - name: config
              mountPath: /data/server.toml
              subPath: server.toml
              readOnly: true
            # Directory projection receives Secret updates; Reloader restarts
            # Kanidm so its in-memory TLS acceptor loads the renewed certificate.
            - name: tls-secret
              mountPath: /data/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kanidm-config
            items:
              - key: server.toml
                path: server.toml
        - name: tls-secret
          secret:
            secretName: kanidm-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: data
          persistentVolumeClaim:
            claimName: kanidm-data
