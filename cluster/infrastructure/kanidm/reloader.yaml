apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: kanidm
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanidm-reloader
  namespace: kanidm
spec:
  interval: 30m
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: kanidm
  values:
    fullnameOverride: kanidm-reloader
    reloader:
      # Namespace-scoped RBAC; only explicitly annotated workloads restart.
      watchGlobally: false
      autoReloadAll: false
      ignoreConfigMaps: true
      reloadStrategy: annotations
      syncAfterRestart: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
