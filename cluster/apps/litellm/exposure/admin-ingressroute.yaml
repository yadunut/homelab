apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-admin
  namespace: litellm
spec:
  entryPoints:
    - websecure
  routes:
    # Native Kanidm OIDC protects UI login; management APIs enforce LiteLLM auth.
    # Login, callback, and static UI assets must be reachable before sign-in.
    - match: Host(`litellm.yadunut.dev`)
      kind: Rule
      services:
        - name: litellm
          port: http
  tls:
    secretName: litellm-admin-tls
