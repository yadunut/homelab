apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: llama
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: penguin
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: download-model
          # curlimages/curl:8.16.0
          image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /models
              download() {
                file="$1" url="$2" sha="$3"
                if [ -f "$file" ] && echo "$sha  $file" | sha256sum -c -; then
                  return 0
                fi
                curl --fail --location --retry 5 --retry-delay 10 \
                  --connect-timeout 30 --continue-at - \
                  --output "$file.partial" "$url"
                echo "$sha  $file.partial" | sha256sum -c - || {
                  rm -f "$file.partial"
                  exit 1
                }
                mv "$file.partial" "$file"
              }
              download "$MODEL_FILE" "$MODEL_URL" "$MODEL_SHA256"
              download "$DRAFT_FILE" "$DRAFT_URL" "$DRAFT_SHA256"
          env:
            - name: MODEL_FILE
              value: Inkling-2-Mini-UD-Q2_K_XL.gguf
            - name: MODEL_URL
              value: https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/8078d149286eec7193795413b9e0643da6d11fa1/Inkling-2-Mini-UD-Q2_K_XL.gguf
            - name: MODEL_SHA256
              value: b42841608ea380ddde5a3f1125081357128a3c71b80d006246de4e31292fc6c1
            - name: DRAFT_FILE
              value: dspark-Inkling-2-Mini-Q8_0_Old.gguf
            - name: DRAFT_URL
              value: https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/8078d149286eec7193795413b9e0643da6d11fa1/dspark-Inkling-2-Mini-Q8_0_Old.gguf
            - name: DRAFT_SHA256
              value: 2ec78510da837e8fc3be54a14757a0c5fbd2d8d9e85a0d92853fafdf674f3773
          # Direct IPv6 / DNS64 egress; the legacy http-proxy Service is absent.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama
          # Exact benchmarked Unsloth b12649-mix-c7059d6 runtime; images/llama-inkling.
          image: harbor.yadunut.dev/library/llama-inkling@sha256:574a4c1478e576f870f68cf2d9d4186a3277d5a2f43e5286718ebbfb61d12e1f
          # Refuse an empty/comment-only key file instead of starting without auth.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              awk 'NF && $1 !~ /^#/ { found=1 } END { exit !found }' /auth/api-keys
              exec /opt/llama/llama-server "$@"
            - llama-server
            - --model
            - /models/Inkling-2-Mini-UD-Q2_K_XL.gguf
            - --alias
            - inkling-2-mini
            - --host
            - "::"
            - --port
            - "8080"
            - --n-gpu-layers
            - "99"
            - --ctx-size
            - "65536"
            - --parallel
            - "1"
            - --flash-attn
            - "on"
            - --spec-type
            - draft-dspark
            - --model-draft
            - /models/dspark-Inkling-2-Mini-Q8_0_Old.gguf
            - --n-gpu-layers-draft
            - "99"
            - --spec-draft-n-max
            - "2"
            - --cache-type-k
            - f16
            - --cache-type-v
            - f16
            - --batch-size
            - "512"
            - --ubatch-size
            - "512"
            - --threads
            - "16"
            - --threads-batch
            - "16"
            - --reasoning-effort
            - none
            - --cache-ram
            - "16384"
            - --jinja
            - --api-key-file
            - /auth/api-keys
            - --no-webui
            - --no-slots
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu.shared: "1"
            limits:
              memory: 32Gi
              # A time slice shares the entire GPU; it does not reserve VRAM.
              nvidia.com/gpu.shared: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        - name: auth
          secret:
            secretName: llama
            defaultMode: 0440
            items:
              - key: API_KEYS
                path: api-keys
