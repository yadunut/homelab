apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
  labels:
    # Sync this explicit exclusion to the volume; do not enroll media in backup groups.
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/no-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-local-1r
  resources:
    requests:
      storage: 500Gi
---
