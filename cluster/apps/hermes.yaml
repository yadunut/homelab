apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: litellm
  interval: 10m0s
  suspend: true
  path: ./cluster/apps/hermes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
