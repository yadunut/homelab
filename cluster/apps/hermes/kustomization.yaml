apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - onepassworditem.yaml
  - tailscale-onepassworditem.yaml
  - tailscale-pvc.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingressroute.yaml
configMapGenerator:
  - name: hermes-tailnet-dns
    namespace: hermes
    files:
      - Corefile=tailnet.Corefile
  - name: hermes-kubeconfig
    namespace: hermes
    files:
      - config=kubeconfig.yaml
  - name: hermes-bootstrap
    namespace: hermes
    files:
      - config.yaml=bootstrap-config.yaml
