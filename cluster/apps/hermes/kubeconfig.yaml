apiVersion: v1
kind: Config
clusters:
  - name: homelab
    cluster:
      server: https://kubernetes.default.svc.k8s.internal:443
      certificate-authority: /var/run/hermes-kubernetes/ca.crt
users:
  - name: hermes
    user:
      tokenFile: /var/run/hermes-kubernetes/token
contexts:
  - name: hermes@homelab
    context:
      cluster: homelab
      user: hermes
      namespace: hermes
current-context: hermes@homelab
