apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: bootstrap
          image: nousresearch/hermes-agent@sha256:b27ce2c14a6bf47070c562f80b0950a9808bdee1baec42d68f0e5a013d385290
          command: ["/opt/hermes/.venv/bin/python", "-c"]
          args:
            - |
              import os
              import pwd
              from pathlib import Path
              import yaml
              from dotenv import unset_key

              # Config helpers create backups on import; run them as Hermes.
              user = pwd.getpwnam("hermes")
              data = Path("/opt/data")
              os.chown(data, user.pw_uid, user.pw_gid)
              # Repair backup directories created by the previous root bootstrap.
              for directory in (data / "backups", data / "backups/config"):
                  if directory.is_dir() and not directory.is_symlink():
                      os.chown(directory, user.pw_uid, user.pw_gid)
              os.setgroups([])
              os.setgid(user.pw_gid)
              os.setuid(user.pw_uid)
              from hermes_cli.tools_config import _get_platform_tools

              seed = yaml.safe_load(Path("/bootstrap/config.yaml").read_text())
              path = Path("/opt/data/config.yaml")
              config = yaml.safe_load(path.read_text()) if path.exists() else seed
              config.setdefault("dashboard", {})["trusted_proxies"] = seed["dashboard"]["trusted_proxies"]
              config.setdefault("bot_desktop", {}).update(seed["bot_desktop"])
              config.setdefault("browser", {})["headed"] = seed["browser"]["headed"]
              # Keep existing tool choices; enable desktop and browser on both surfaces.
              for platform in ("cli", "telegram"):
                  existing = config.get("platform_toolsets", {}).get(platform)
                  enabled = set(existing) if isinstance(existing, list) else _get_platform_tools(config, platform, include_default_mcp_servers=False)
                  config.setdefault("platform_toolsets", {})[platform] = sorted(enabled | {"computer_use", "browser"})
              providers = config.setdefault("providers", {})
              providers["litellm"] = seed["providers"]["litellm"]
              model = config.setdefault("model", dict(seed["model"]))
              # Migrate the old direct providers once; preserve later UI selections.
              if model.get("provider") in ("openrouter", "custom:llama"):
                  if model["provider"] == "openrouter" and model.get("default"):
                      name = model["default"]
                      model["default"] = name if name.startswith("openrouter/") else "openrouter/" + name
                  model["provider"] = "custom:litellm"
                  for field in ("base_url", "api_key", "api_mode"):
                      model.pop(field, None)
              if providers.get("llama", {}).get("key_cmd") == "head -n 1 /llama-auth/api-keys":
                  providers.pop("llama")
              env_file = Path("/opt/data/.env")
              if env_file.exists():
                  env_stat = env_file.stat()
                  unset_key(str(env_file), "OPENROUTER_API_KEY")
                  env_file.chmod(env_stat.st_mode & 0o777)
                  os.chown(env_file, env_stat.st_uid, env_stat.st_gid)
              user = pwd.getpwnam("hermes")
              temporary = path.with_suffix(".yaml.tmp")
              temporary.write_text(yaml.safe_dump(config, sort_keys=False))
              temporary.chmod(0o640)
              os.chown(temporary, user.pw_uid, user.pw_gid)
              temporary.replace(path)
              workspace = Path("/opt/data/workspace")
              workspace.mkdir(exist_ok=True)
              os.chown(workspace, user.pw_uid, user.pw_gid)
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
        - name: computer-use-driver
          image: nousresearch/hermes-agent@sha256:b27ce2c14a6bf47070c562f80b0950a9808bdee1baec42d68f0e5a013d385290
          command: ["/opt/hermes/.venv/bin/python", "-c"]
          args:
            - |
              import hashlib
              import io
              import platform
              import tarfile
              import urllib.request
              from pathlib import Path

              # Pin the driver independently: this Hermes release's installer
              # otherwise fetches a moving upstream release at runtime.
              artifacts = {
                  "x86_64": ("x86_64", "a1d99fd04bb4927ef5ffdbe60eb91ed8b51a2bab60e10fc604a75bd59ce69c3e"),
                  "aarch64": ("arm64", "55e8a32839a4ac369a773df4dac87b345bd4567779221ade4a5e39223a45a2e8"),
              }
              arch, checksum = artifacts[platform.machine()]
              url = f"https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.28.2/cua-driver-rs-0.28.2-linux-{arch}-binary.tar.gz"
              with urllib.request.urlopen(url, timeout=120) as response:
                  archive = response.read()
              if hashlib.sha256(archive).hexdigest() != checksum:
                  raise RuntimeError("cua-driver archive checksum mismatch")
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
                  binary = Path("/computer-use/cua-driver")
                  binary.write_bytes(bundle.extractfile("cua-driver").read())
                  binary.chmod(0o755)
          volumeMounts:
            - name: computer-use
              mountPath: /computer-use
      containers:
        - name: hermes
          # Official desktop variant includes TigerVNC, Xfce and Chromium.
          image: nousresearch/hermes-agent@sha256:b27ce2c14a6bf47070c562f80b0950a9808bdee1baec42d68f0e5a013d385290
          # Preserve the image entrypoint: s6 supervises gateway and dashboard
          # and drops application processes to the hermes runtime user.
          args: ["gateway", "run"]
          ports:
            - name: dashboard
              containerPort: 9119
          env:
            - name: TZ
              value: Asia/Singapore
            - name: HERMES_CUA_DRIVER_CMD
              value: /computer-use/cua-driver
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "::"
            # The embedded TUI otherwise maps the wildcard bind to IPv4 loopback.
            - name: HERMES_DASHBOARD_WS_HOST
              value: "::1"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.yadunut.dev
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: https://idm.yadunut.dev/oauth2/openid/hermes
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: hermes
            - name: HERMES_DASHBOARD_OIDC_SCOPES
              value: "openid profile email"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: TELEGRAM_BOT_TOKEN
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: LITELLM_API_KEY
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: TELEGRAM_ALLOWED_USERS
            - name: TELEGRAM_ALLOW_ALL_USERS
              value: "false"
            # IPv4 literals bypass DNS64 and fail in an IPv6-only pod.
            # Use PTB's standard hostname transport instead of Hermes's fallback.
            - name: HERMES_TELEGRAM_DISABLE_FALLBACK_IPS
              value: "true"
            # Direct IPv6 / cluster DNS64 egress; the legacy http-proxy
            # service no longer exists. Telegram works directly.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/status
              port: dashboard
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: dashboard
            periodSeconds: 10
          # s6 restarts failed gateway/dashboard processes independently.
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: computer-use
              mountPath: /computer-use
              readOnly: true
      volumes:
        - name: computer-use
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
