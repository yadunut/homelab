# Seeded once; trusted_proxies is reconciled on each start.
model:
  provider: openrouter
terminal:
  backend: local
  cwd: /opt/data/workspace
dashboard:
  public_url: https://hermes.yadunut.dev
  trusted_proxies:
    # Traefik uses host networking on these three ingress nodes.
    - "fd5f:97ba:c64d::1"
    - "fd5f:97ba:c64d::2"
    - "fd5f:97ba:c64d::3"
    # Host-to-pod connections use the ingress nodes' CiliumInternalIP.
    - "fd00:10:96::3d2a"
    - "fd00:10:96:1::428e"
    - "fd00:10:96:2::b0ed"
