# Seeded once; trusted_proxies and providers.llama are reconciled on each start.
model:
  provider: custom:llama
  default: qwen3.8-27b
providers:
  llama:
    base_url: http://llama.llama.svc.k8s.internal:8080/v1
    default_model: qwen3.8-27b
    api_mode: chat_completions
    models:
      qwen3.8-27b:
        context_length: 16384
        max_output_tokens: 4096
    # Read the Hermes token (first line) without persisting it in config.yaml.
    key_cmd: head -n 1 /llama-auth/api-keys
terminal:
  backend: local
  cwd: /opt/data/workspace
dashboard:
  public_url: https://hermes.yadunut.dev
  trusted_proxies:
    # Traefik uses host networking on these three ingress nodes.
    - "fd5f:97ba:c64d::1"
    - "fd5f:97ba:c64d::2"
    - "fd5f:97ba:c64d::3"
    # Host-to-pod connections use the ingress nodes' CiliumInternalIP.
    - "fd00:10:96::3d2a"
    - "fd00:10:96:1::428e"
    - "fd00:10:96:2::b0ed"
