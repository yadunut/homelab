# Select the model in the UI; reconcile the LiteLLM connection and trusted proxies.
model:
  provider: custom:litellm
providers:
  litellm:
    base_url: http://litellm.litellm.svc.k8s.internal:4000/v1
    api_mode: chat_completions
    key_env: LITELLM_API_KEY
    discover_models: true
terminal:
  backend: local
  cwd: /opt/data/workspace
bot_desktop:
  auto_start: true
  idle_stop_minutes: 30
  geometry: "1440x900"
browser:
  headed: true
dashboard:
  public_url: https://hermes.yadunut.dev
  trusted_proxies:
    # Traefik uses host networking on these three ingress nodes.
    - "fd5f:97ba:c64d::1"
    - "fd5f:97ba:c64d::2"
    - "fd5f:97ba:c64d::3"
    # Host-to-pod connections use the ingress nodes' CiliumInternalIP.
    - "fd00:10:96::3d2a"
    - "fd00:10:96:1::428e"
    - "fd00:10:96:2::b0ed"
